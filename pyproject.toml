[project]
name = "formi-controller"
version = "0.1.0"
description = "Outcome-first controller for the Formi voice-agent simulator (talks to it only over HTTP)."
requires-python = ">=3.11"
# Runtime dependencies as ranges; the image installs the exact versions of requirements-runtime.lock.
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["controller*"]

[tool.setuptools.package-data]
controller = ["directives.yaml", "store/migrations/*.sql", "ingest/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib mode: test files in tests/unit, tests/e2e, tests/contract may share basenames.
addopts = "--import-mode=importlib"
markers = [
    "e2e: starts a real simulator process and talks to it over HTTP",
    "pg: needs a reachable Postgres (CTL_PG_* or PG_DSN)",
    "slow: takes more than about a minute",
]
